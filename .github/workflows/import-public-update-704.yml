name: Import Lumi Code704 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-704.yml'

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code704 package into public distribution lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-4190-81fd-bf5c-68b7f24a81ab/raw?se=2026-09-13T16%3A01%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=b1f125a3-687e-53ba-bc29-fbd5f358b572&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T13%3A02%3A11Z&ske=2026-09-14T13%3A02%3A11Z&sks=b&skv=2026-02-06&sig=eVuehNWVyLXA/XK0hfqM%2B2%2Bjlw11JLETQ6tuCoGUuSo%3D' -o /tmp/artifact.zip
          rm -rf /tmp/artifact && mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          PKG=$(find /tmp/artifact -type f -name 'Lumi-Code704-Public-Update-Channel-R414.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code704-Public-Update-Channel-R414.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code704-Public-Update-Channel-R414.zip | awk '{print $1}')
          test "$ACTUAL" = '9357b7ee083d2102b3334814734c5733f3874b28d52bf28e04708a8961e35a22'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code704-public-update-channel-r414","baseVersionCode":703,"targetVersionCode":704,"targetVersionName":"5.0.44-public-update-channel-r414","packageFile":"Lumi-Code704-Public-Update-Channel-R414.zip","packageSha256":"9357b7ee083d2102b3334814734c5733f3874b28d52bf28e04708a8961e35a22","releaseNotes":"Credential-free public signed update discovery. Private source/build/signing remain private; SHA/signature verification and Android installer approval remain mandatory."}
          JSON
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code704 on public signed update channel'
          git push
