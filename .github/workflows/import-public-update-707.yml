name: Import Lumi Code707 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-707.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code707 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-d39c-81f6-8e59-da84b2c9047a/raw?se=2026-09-13T17%3A59%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=c03b2b2d-3b8a-5a37-95a7-fdaad78f6778&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T14%3A42%3A27Z&ske=2026-09-14T14%3A42%3A27Z&sks=b&skv=2026-02-06&sig=D9IBHuwF5G1uVK3D9YZxRG0FTwbaWALsV2XHlKi1xmg%3D' -o /tmp/code707-artifact.zip
          rm -rf /tmp/code707-artifact && mkdir -p /tmp/code707-artifact
          unzip -q /tmp/code707-artifact.zip -d /tmp/code707-artifact
          PKG=$(find /tmp/code707-artifact -type f -name 'Lumi-Code707-Provider-Vault-Recovery-R417.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code707-Provider-Vault-Recovery-R417.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code707-Provider-Vault-Recovery-R417.zip | awk '{print $1}')
          test "$ACTUAL" = '1b2f947e0957518908c79012cbb6e0fdaf221567535b99497aeb1abb7e71f966'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code707-provider-vault-recovery-r417","baseVersionCode":706,"minBaseVersionCode":706,"maxBaseVersionCode":706,"targetVersionCode":707,"targetVersionName":"5.0.47-provider-vault-recovery-r417","packageFile":"Lumi-Code707-Provider-Vault-Recovery-R417.zip","packageSha256":"1b2f947e0957518908c79012cbb6e0fdaf221567535b99497aeb1abb7e71f966","releaseNotes":"Provider vault recovery: normalize preserved encrypted OpenAI, Groq, OpenRouter, Gemini, and Cloudflare credentials and known historical aliases into current secure slots without exposing secret values. Existing zero-cash routing and Code706 convergence/update security remain authoritative."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=data.setdefault('updates',[])
          updates=[u for u in updates if int(u.get('targetVersionCode',-1))!=707]
          updates.append({
            "updateId":"code707-provider-vault-recovery-r417",
            "baseVersionCode":706,"minBaseVersionCode":706,"maxBaseVersionCode":706,
            "targetVersionCode":707,"targetVersionName":"5.0.47-provider-vault-recovery-r417",
            "packageFile":"Lumi-Code707-Provider-Vault-Recovery-R417.zip",
            "packageSha256":"1b2f947e0957518908c79012cbb6e0fdaf221567535b99497aeb1abb7e71f966",
            "releaseNotes":"Provider vault recovery and presence-only diagnostics."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code707 provider vault recovery on public signed update channel'
          git push
