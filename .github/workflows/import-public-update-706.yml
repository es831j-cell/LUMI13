name: Import Lumi Code706 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-706.yml'

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code706 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-082c-81f7-80d0-5cbfb9d5b9fe/raw?se=2026-09-13T16%3A51%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=77be3b5a-d11e-5e42-854d-290177965ebb&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T11%3A05%3A07Z&ske=2026-09-14T11%3A05%3A07Z&sks=b&skv=2026-02-06&sig=D7knfePOyAay0wYIwXtFedfKFjwvKGTArlAfySy4YF0%3D' -o /tmp/code706-artifact.zip
          rm -rf /tmp/code706-artifact && mkdir -p /tmp/code706-artifact
          unzip -q /tmp/code706-artifact.zip -d /tmp/code706-artifact
          PKG=$(find /tmp/code706-artifact -type f -name 'Lumi-Code706-Convergence-R416.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code706-Convergence-R416.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code706-Convergence-R416.zip | awk '{print $1}')
          test "$ACTUAL" = 'fea01ec83ba8599b9f16a4655d4bf3d5b5b8e70bd5472db1a677b12d9e595374'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code706-convergence-r416","baseVersionCode":705,"minBaseVersionCode":705,"maxBaseVersionCode":705,"targetVersionCode":706,"targetVersionName":"5.0.46-convergence-r416","packageFile":"Lumi-Code706-Convergence-R416.zip","packageSha256":"fea01ec83ba8599b9f16a4655d4bf3d5b5b8e70bd5472db1a677b12d9e595374","releaseNotes":"Convergence: autonomous discovery through background JobScheduler, deterministic cached-package handoff, truthful scheduler telemetry, current-release causal and goal isolation, and sequential catch-up selection. Existing signed-update verification and Android installer approval remain mandatory."}
          JSON
          cat > .lumi/public-updates/index.json <<'JSON'
          {"format":"LumiPublicUpdateIndex","formatVersion":1,"updates":[{"updateId":"code703-manual-update-check-r413","baseVersionCode":702,"minBaseVersionCode":702,"maxBaseVersionCode":702,"targetVersionCode":703,"targetVersionName":"5.0.43-manual-update-check-r413","packageFile":"Lumi-Code703-Manual-Update-Check-R413.zip","packageSha256":"3d1fe08587e534f649fae21b8ad873fdf85acfc0f830f3cee5baa8245ddbf434","releaseNotes":"Manual update check and update-channel diagnostics."},{"updateId":"code704-public-update-channel-r414","baseVersionCode":703,"minBaseVersionCode":703,"maxBaseVersionCode":703,"targetVersionCode":704,"targetVersionName":"5.0.44-public-update-channel-r414","packageFile":"Lumi-Code704-Public-Update-Channel-R414.zip","packageSha256":"9357b7ee083d2102b3334814734c5733f3874b28d52bf28e04708a8961e35a22","releaseNotes":"Credential-free public signed update distribution."},{"updateId":"code705-self-update-proof-r415","baseVersionCode":704,"minBaseVersionCode":704,"maxBaseVersionCode":704,"targetVersionCode":705,"targetVersionName":"5.0.45-self-update-proof-r415","packageFile":"Lumi-Code705-Self-Update-Proof-R415.zip","packageSha256":"2adc055786b2a01f1f75bb511e08eac9ade46b776fd5bb9eeb97e0cbda5efc09","releaseNotes":"Transaction-aware validation and update proof."},{"updateId":"code706-convergence-r416","baseVersionCode":705,"minBaseVersionCode":705,"maxBaseVersionCode":705,"targetVersionCode":706,"targetVersionName":"5.0.46-convergence-r416","packageFile":"Lumi-Code706-Convergence-R416.zip","packageSha256":"fea01ec83ba8599b9f16a4655d4bf3d5b5b8e70bd5472db1a677b12d9e595374","releaseNotes":"Autonomous discovery convergence and sequential catch-up."}]}
          JSON
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code706 convergence on public signed update channel'
          git push
