name: Import Lumi Code712 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-712.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code712 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-42e0-81f5-8cb3-830931b7efb1/raw?se=2026-09-13T23%3A09%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=bce3e4ba-0fb4-535e-9562-8979f27c4c1f&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T21%3A56%3A26Z&ske=2026-09-14T21%3A56%3A26Z&sks=b&skv=2026-02-06&sig=NMIzm4rVYEs3kR5SsDIpXaj1FS4W0qp3JGE2GwhcCKE%3D' -o /tmp/code712-artifact.zip
          test "$(sha256sum /tmp/code712-artifact.zip | awk '{print $1}')" = 'daed9579ba75b81353dd35464354de48f266a0d0d8ec058fe425e54c7cda05fc'
          rm -rf /tmp/code712-artifact && mkdir -p /tmp/code712-artifact
          unzip -q /tmp/code712-artifact.zip -d /tmp/code712-artifact
          PKG=$(find /tmp/code712-artifact -type f -name 'Lumi-Code712-Avatar-Forge-PBR-R422.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code712-Avatar-Forge-PBR-R422.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code712-Avatar-Forge-PBR-R422.zip | awk '{print $1}')
          test "$ACTUAL" = '9b277cef507a09342291e2283947c929f2de6d84b644629e9beab9e93f265194'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code712-avatar-forge-pbr-r422","baseVersionCode":711,"minBaseVersionCode":711,"maxBaseVersionCode":711,"targetVersionCode":712,"targetVersionName":"5.0.52-avatar-forge-pbr-r422","packageFile":"Lumi-Code712-Avatar-Forge-PBR-R422.zip","packageSha256":"9b277cef507a09342291e2283947c929f2de6d84b644629e9beab9e93f265194","releaseNotes":"Owner-governed Avatar Forge: Filament PBR scene, validated GLB runtime model slot, exact owner reference + PixelCopy phone evidence, bounded self-tuning, and procedural recovery fallback; Code711/710/709 foundations preserved."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=[u for u in data.setdefault('updates',[]) if int(u.get('targetVersionCode',-1))!=712]
          updates.append({
            "updateId":"code712-avatar-forge-pbr-r422",
            "baseVersionCode":711,"minBaseVersionCode":711,"maxBaseVersionCode":711,
            "targetVersionCode":712,"targetVersionName":"5.0.52-avatar-forge-pbr-r422",
            "packageFile":"Lumi-Code712-Avatar-Forge-PBR-R422.zip",
            "packageSha256":"9b277cef507a09342291e2283947c929f2de6d84b644629e9beab9e93f265194",
            "releaseNotes":"Avatar Forge PBR: Lumi Core owns the Filament/glTF avatar model slot, phone evidence, bounded visual tuning, and procedural recovery fallback."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code712 Avatar Forge PBR on public signed update channel'
          git push
