name: Build Workstation 0.6.1

on:
  push:
    branches:
      - workstation-020-build
    paths:
      - 'workstation020/**'
      - '.github/workflows/build-workstation-020.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore workstation020/LumiDockingStation.csproj

      - name: Build
        run: dotnet build workstation020/LumiDockingStation.csproj -c Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish workstation020/LumiDockingStation.csproj -c Release -r win-x64 --self-contained true -o workstation020/publish

      - name: Verify Lumi self-evaluation repair runtime docking scrolling and Git bootstrap
        shell: powershell
        run: |
          $required = @(
            'workstation020/DockTransferUpgrade.cs',
            'workstation020/LumiDesktopRuntime.cs',
            'workstation020/ScrollableConsoleUpgrade.cs',
            'workstation020/SelfEvaluationUpgrade.cs',
            'workstation020/BundledGitUpgrade.cs'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing required source: $file" } }
          $dock = Get-Content 'workstation020/DockTransferUpgrade.cs' -Raw
          $runtime = Get-Content 'workstation020/LumiDesktopRuntime.cs' -Raw
          $scroll = Get-Content 'workstation020/ScrollableConsoleUpgrade.cs' -Raw
          $self = Get-Content 'workstation020/SelfEvaluationUpgrade.cs' -Raw
          $gitBootstrap = Get-Content 'workstation020/BundledGitUpgrade.cs' -Raw
          if ($dock -notmatch 'DOCK PASS') { throw 'Dock transfer acceptance marker missing' }
          if ($dock -notmatch 'adb.*pull|pull.*adb') { throw 'No real ADB pull path found in docking source' }
          if ($runtime -notmatch 'activeHost = "windows-workstation"') { throw 'Windows host ownership marker missing' }
          if ($runtime -notmatch 'ExecuteLumiToolAsync') { throw 'Lumi tool executor missing' }
          if ($runtime -notmatch 'AI providers are reasoning engines') { throw 'Lumi/provider role separation marker missing' }
          if ($scroll -notmatch 'PreviewMouseWheel') { throw 'Command console mouse-wheel capture missing' }
          if ($scroll -notmatch 'PageUp') { throw 'Command console Page Up support missing' }
          if ($self -notmatch 'RunSelfAuditAsync') { throw 'Deterministic self-audit missing' }
          if ($self -notmatch 'RunSelfRepairCycleAsync') { throw 'Self-repair cycle missing' }
          if ($self -notmatch 'CommissionCanonicalSourceAsync') { throw 'Canonical source commission path missing' }
          if ($self -notmatch 'packageSha256') { throw 'Canonical package SHA verification missing' }
          if ($self -notmatch 'BuildLiveSourceAsync\(false\)') { throw 'Post-repair local build validation missing' }
          if ($self -notmatch 'SelfEvaluation_PreviewKeyDown') { throw 'Self-question deterministic interception missing' }
          if ($gitBootstrap -notmatch 'PrepareBundledGitEnvironment') { throw 'Bundled Git PATH bootstrap missing' }
          if ($gitBootstrap -notmatch 'git-credential-manager.exe') { throw 'Git Credential Manager support missing' }
          if ($gitBootstrap -notmatch 'GITHUB AUTH PASS') { throw 'GitHub authentication verification path missing' }

      - name: Bundle Android platform-tools
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'android-platform-tools'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $source = Join-Path $extract 'platform-tools'
          $dest = 'workstation020/publish/platform-tools'
          if (-not (Test-Path (Join-Path $source 'adb.exe'))) { throw 'Google platform-tools archive did not contain adb.exe' }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $dest -Recurse -Force
          if (-not (Test-Path (Join-Path $dest 'adb.exe'))) { throw 'adb.exe was not bundled into publish output' }
          & (Join-Path $dest 'adb.exe') version

      - name: Bundle Portable Git and Git Credential Manager
        shell: powershell
        run: |
          $headers = @{ 'User-Agent' = 'Lumi-Workstation-Build'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw 'Could not locate latest 64-bit PortableGit asset' }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $archive
          $dest = Join-Path (Resolve-Path 'workstation020/publish').Path 'git'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $archive '-y' ("-o$dest") | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "PortableGit extraction failed with exit $LASTEXITCODE" }
          $git = Join-Path $dest 'cmd\git.exe'
          if (-not (Test-Path $git)) { throw 'Bundled PortableGit did not contain cmd\git.exe' }
          $gcm = Get-ChildItem -Path $dest -Recurse -Filter 'git-credential-manager.exe' | Select-Object -First 1
          if (-not $gcm) { throw 'Bundled PortableGit did not contain Git Credential Manager' }
          & $git --version
          & $gcm.FullName --version

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc 'workstation020\installer\LumiDockingStation.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: powershell
        run: |
          $exe = 'workstation020/artifacts/Lumi-Workstation-Setup-0.6.1.exe'
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          if (-not (Test-Path 'workstation020/publish/platform-tools/adb.exe')) { throw 'Bundled adb.exe missing before upload' }
          if (-not (Test-Path 'workstation020/publish/git/cmd/git.exe')) { throw 'Bundled git.exe missing before upload' }
          $gcm = Get-ChildItem -Path 'workstation020/publish/git' -Recurse -Filter 'git-credential-manager.exe' | Select-Object -First 1
          if (-not $gcm) { throw 'Bundled Git Credential Manager missing before upload' }
          if (-not (Test-Path 'workstation020/publish/LumiDockingStation.exe')) { throw 'Workstation binary missing before upload' }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Workstation-Setup-0.6.1
          path: workstation020/artifacts/Lumi-Workstation-Setup-0.6.1.exe
          if-no-files-found: error
          retention-days: 14
