name: Build Workstation 0.6.5

on:
  push:
    branches:
      - workstation-020-build
    paths:
      - 'workstation020/**'
      - '.github/workflows/build-workstation-020.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup JDK 17 for bundled Android toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore
        run: dotnet restore workstation020/LumiDockingStation.csproj

      - name: Build
        run: dotnet build workstation020/LumiDockingStation.csproj -c Release --no-restore

      - name: Publish self-contained x64
        run: dotnet publish workstation020/LumiDockingStation.csproj -c Release -r win-x64 --self-contained true -o workstation020/publish

      - name: Verify Lumi self-repair V2 source commissioning and build toolchain logic
        shell: powershell
        run: |
          $required = @(
            'workstation020/DockTransferUpgrade.cs',
            'workstation020/LumiDesktopRuntime.cs',
            'workstation020/ScrollableConsoleUpgrade.cs',
            'workstation020/SelfEvaluationUpgradeV2.cs',
            'workstation020/AndroidBuildToolchainUpgrade.cs',
            'workstation020/BundledGitUpgrade.cs',
            'workstation020/PhoneDetectionUpgrade.cs',
            'workstation020/GitHubRepairResumeUpgrade.cs',
            'workstation020/installer/LumiDockingStation.iss'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing required source: $file" } }
          $dock = Get-Content 'workstation020/DockTransferUpgrade.cs' -Raw
          $runtime = Get-Content 'workstation020/LumiDesktopRuntime.cs' -Raw
          $scroll = Get-Content 'workstation020/ScrollableConsoleUpgrade.cs' -Raw
          $self = Get-Content 'workstation020/SelfEvaluationUpgradeV2.cs' -Raw
          $toolchain = Get-Content 'workstation020/AndroidBuildToolchainUpgrade.cs' -Raw
          $gitBootstrap = Get-Content 'workstation020/BundledGitUpgrade.cs' -Raw
          $phone = Get-Content 'workstation020/PhoneDetectionUpgrade.cs' -Raw
          $authResume = Get-Content 'workstation020/GitHubRepairResumeUpgrade.cs' -Raw
          $installer = Get-Content 'workstation020/installer/LumiDockingStation.iss' -Raw
          $project = Get-Content 'workstation020/LumiDockingStation.csproj' -Raw
          if ($project -notmatch 'Compile Remove="SelfEvaluationUpgrade.cs"') { throw 'Legacy wrapper-only self audit is still compiled' }
          if ($dock -notmatch 'DOCK PASS') { throw 'Dock transfer acceptance marker missing' }
          if ($runtime -notmatch 'activeHost = "windows-workstation"') { throw 'Windows host ownership marker missing' }
          if ($runtime -notmatch 'ExecuteLumiToolAsync') { throw 'Lumi tool executor missing' }
          if ($runtime -notmatch 'AI providers are reasoning engines') { throw 'Lumi/provider role separation marker missing' }
          if ($scroll -notmatch 'PreviewMouseWheel') { throw 'Command console mouse-wheel capture missing' }
          if ($self -notmatch 'RunSelfAuditV2Async') { throw 'V2 deterministic self-audit missing' }
          if ($self -notmatch 'RunSelfRepairCycleAsync') { throw 'V2 self-repair cycle missing' }
          if ($self -notmatch 'IsLumiAndroidSourceReady') { throw 'Android-project source identity gate missing' }
          if ($self -notmatch 'appBuild') { throw 'app/build.gradle project-root discovery missing' }
          if ($self -notmatch 'packageSha256') { throw 'Canonical package SHA verification missing' }
          if ($self -notmatch 'CommissionSigningVaultAsync') { throw 'Signing-vault commissioning path missing' }
          if ($toolchain -notmatch 'LUMI_GRADLE_HOME') { throw 'Bundled Gradle environment missing' }
          if ($toolchain -notmatch 'JAVA_HOME') { throw 'Bundled JDK environment missing' }
          if ($toolchain -notmatch 'ANDROID_SDK_ROOT') { throw 'Bundled Android SDK environment missing' }
          if ($toolchain -notmatch 'BuildWithSigningAsync') { throw 'Secure signed build path missing' }
          if ($toolchain -notmatch 'ProtectedData.Unprotect') { throw 'DPAPI signing restore missing' }
          if ($gitBootstrap -notmatch 'git-credential-manager.exe') { throw 'Git Credential Manager support missing' }
          if ($phone -notmatch 'AppContext.BaseDirectory.*platform-tools') { throw 'Bundled ADB app-directory path missing' }
          if ($authResume -notmatch 'Resuming self-repair automatically') { throw 'Automatic GitHub auth resume missing' }
          if ($installer -notmatch 'kill-server') { throw 'Installer does not stop ADB server before upgrade' }
          if ($installer -notmatch 'taskkill /IM adb\.exe') { throw 'Installer does not force-release stale adb.exe' }

      - name: Bundle Android platform-tools
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'android-platform-tools'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $source = Join-Path $extract 'platform-tools'
          $dest = 'workstation020/publish/platform-tools'
          if (-not (Test-Path (Join-Path $source 'adb.exe'))) { throw 'Google platform-tools archive did not contain adb.exe' }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $dest -Recurse -Force
          & (Join-Path $dest 'adb.exe') version

      - name: Bundle Portable Git and Git Credential Manager
        shell: powershell
        run: |
          $headers = @{ 'User-Agent' = 'Lumi-Workstation-Build'; 'Accept' = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw 'Could not locate latest 64-bit PortableGit asset' }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $archive
          $dest = Join-Path (Resolve-Path 'workstation020/publish').Path 'git'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & $archive '-y' ("-o$dest") | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "PortableGit extraction failed with exit $LASTEXITCODE" }
          $git = Join-Path $dest 'cmd\git.exe'
          if (-not (Test-Path $git)) { throw 'Bundled PortableGit did not contain cmd\git.exe' }
          $gcm = Get-ChildItem -Path $dest -Recurse -Filter 'git-credential-manager.exe' | Select-Object -First 1
          if (-not $gcm) { throw 'Bundled PortableGit did not contain Git Credential Manager' }
          & $git --version
          & $gcm.FullName --version

      - name: Bundle Gradle 8.9
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gradle-8.9-bin.zip'
          Invoke-WebRequest -Uri 'https://services.gradle.org/distributions/gradle-8.9-bin.zip' -OutFile $zip
          $dest = 'workstation020/publish/toolchain/gradle'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $gradle = Join-Path $dest 'gradle-8.9\bin\gradle.bat'
          if (-not (Test-Path $gradle)) { throw 'Gradle 8.9 was not bundled correctly' }
          & $gradle --version

      - name: Bundle JDK 17
        shell: powershell
        run: |
          if (-not $env:JAVA_HOME) { throw 'JAVA_HOME missing after setup-java' }
          $dest = 'workstation020/publish/toolchain/jdk'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $env:JAVA_HOME '*') -Destination $dest -Recurse -Force
          $java = Join-Path $dest 'bin\java.exe'
          if (-not (Test-Path $java)) { throw 'JDK 17 java.exe missing from bundled toolchain' }
          & $java -version

      - name: Bundle Android API 35 build SDK
        shell: powershell
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Hosted runner Android SDK root is unavailable' }
          $sdkManager = Join-Path $sdk 'cmdline-tools\latest\bin\sdkmanager.bat'
          $platform = Join-Path $sdk 'platforms\android-35\android.jar'
          $bt34 = Join-Path $sdk 'build-tools\34.0.0\aapt2.exe'
          $bt35 = Join-Path $sdk 'build-tools\35.0.0\aapt2.exe'
          if ((-not (Test-Path $platform)) -or (-not (Test-Path $bt34)) -or (-not (Test-Path $bt35))) {
            if (-not (Test-Path $sdkManager)) { throw 'sdkmanager not available to prepare API 35 build SDK' }
            & $sdkManager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
            if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed preparing API 35 build SDK' }
          }
          $dest = 'workstation020/publish/toolchain/android-sdk'
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'platforms') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'build-tools') | Out-Null
          Copy-Item -Path (Join-Path $sdk 'platforms\android-35') -Destination (Join-Path $dest 'platforms\android-35') -Recurse -Force
          Copy-Item -Path (Join-Path $sdk 'build-tools\34.0.0') -Destination (Join-Path $dest 'build-tools\34.0.0') -Recurse -Force
          Copy-Item -Path (Join-Path $sdk 'build-tools\35.0.0') -Destination (Join-Path $dest 'build-tools\35.0.0') -Recurse -Force
          if (-not (Test-Path (Join-Path $dest 'platforms\android-35\android.jar'))) { throw 'Bundled Android API 35 platform missing' }
          if (-not (Test-Path (Join-Path $dest 'build-tools\34.0.0\aapt2.exe'))) { throw 'Bundled Android Build Tools 34.0.0 missing' }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc 'workstation020\installer\LumiDockingStation.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer and complete local Android build engine
        shell: powershell
        run: |
          $exe = 'workstation020/artifacts/Lumi-Workstation-Setup-0.6.5.exe'
          if (-not (Test-Path $exe)) { throw "Installer missing: $exe" }
          if (-not (Test-Path 'workstation020/publish/platform-tools/adb.exe')) { throw 'Bundled adb.exe missing' }
          if (-not (Test-Path 'workstation020/publish/git/cmd/git.exe')) { throw 'Bundled git.exe missing' }
          if (-not (Test-Path 'workstation020/publish/toolchain/gradle/gradle-8.9/bin/gradle.bat')) { throw 'Bundled Gradle 8.9 missing' }
          if (-not (Test-Path 'workstation020/publish/toolchain/jdk/bin/java.exe')) { throw 'Bundled JDK 17 missing' }
          if (-not (Test-Path 'workstation020/publish/toolchain/android-sdk/platforms/android-35/android.jar')) { throw 'Bundled API 35 missing' }
          if (-not (Test-Path 'workstation020/publish/toolchain/android-sdk/build-tools/34.0.0/aapt2.exe')) { throw 'Bundled Build Tools 34 missing' }
          $gcm = Get-ChildItem -Path 'workstation020/publish/git' -Recurse -Filter 'git-credential-manager.exe' | Select-Object -First 1
          if (-not $gcm) { throw 'Bundled Git Credential Manager missing' }
          if (-not (Test-Path 'workstation020/publish/LumiDockingStation.exe')) { throw 'Workstation binary missing' }
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Workstation-Setup-0.6.5
          path: workstation020/artifacts/Lumi-Workstation-Setup-0.6.5.exe
          if-no-files-found: error
          retention-days: 14
