name: Import Lumi Code713 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-713.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code713 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-b708-822f-855f-9ead910d9292/raw?se=2026-09-14T00%3A02%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=41e22074-bc7d-545b-a091-a254470fa863&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T12%3A21%3A14Z&ske=2026-09-14T12%3A21%3A14Z&sks=b&skv=2026-02-06&sig=RmQHqtusY7WPChBhJ1MNq0p4zXYk20NZ96wmlZ6ByjE%3D' -o /tmp/code713-artifact.zip
          test "$(sha256sum /tmp/code713-artifact.zip | awk '{print $1}')" = '5cd140218789953926b8663dd358d5d35ef9ac4f5729fcf3cde55d7319f842ff'
          rm -rf /tmp/code713-artifact && mkdir -p /tmp/code713-artifact
          unzip -q /tmp/code713-artifact.zip -d /tmp/code713-artifact
          PKG=$(find /tmp/code713-artifact -type f -name 'Lumi-Code713-Avatar-Lifecycle-R423.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code713-Avatar-Lifecycle-R423.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code713-Avatar-Lifecycle-R423.zip | awk '{print $1}')
          test "$ACTUAL" = '35a994531b1a08a8588251531d3b737272fb61b208de552cca6b4b27a8c444c8'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code713-avatar-lifecycle-r423","baseVersionCode":712,"minBaseVersionCode":712,"maxBaseVersionCode":712,"targetVersionCode":713,"targetVersionName":"5.0.53-avatar-lifecycle-r423","packageFile":"Lumi-Code713-Avatar-Lifecycle-R423.zip","packageSha256":"35a994531b1a08a8588251531d3b737272fb61b208de552cca6b4b27a8c444c8","releaseNotes":"Filament lifecycle crash repaired and PBR exposure calibration reopened below the Code712 floor; unrelated Lumi Core authority, voice, memory, update, and fallback foundations preserved."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=[u for u in data.setdefault('updates',[]) if int(u.get('targetVersionCode',-1))!=713]
          updates.append({
            "updateId":"code713-avatar-lifecycle-r423",
            "baseVersionCode":712,"minBaseVersionCode":712,"maxBaseVersionCode":712,
            "targetVersionCode":713,"targetVersionName":"5.0.53-avatar-lifecycle-r423",
            "packageFile":"Lumi-Code713-Avatar-Lifecycle-R423.zip",
            "packageSha256":"35a994531b1a08a8588251531d3b737272fb61b208de552cca6b4b27a8c444c8",
            "releaseNotes":"Avatar lifecycle repair: ModelViewer owns Filament Engine teardown, GLB reload is in-place, and exposure calibration can move below the old ISO 70 floor."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code713 Avatar Lifecycle Repair on public signed update channel'
          git push
