name: Import Code735 public update fast2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-code735-public-update-fast2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, and publish Code735
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-cdf4-81fd-8a6b-af84e89c9e24/raw?se=2026-09-14T22%3A53%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=21da278e-e7fc-5f2b-b783-8991ded68058&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T19%3A01%3A03Z&ske=2026-09-15T19%3A01%3A03Z&sks=b&skv=2026-02-06&sig=Q/wxeLtT7RNy6p9ok5wA4I/0ETaSyGzCzT8fqj1PAAc%3D'
        run: |
          set -euo pipefail
          curl --fail --location "$EXPORT_URL" -o /tmp/code735-export.zip
          echo "d86e66428e22843988bd9772d484c91136a01090b0ea672d25b040f9ad258c30  /tmp/code735-export.zip" | sha256sum -c -
          mkdir -p /tmp/code735
          unzip -q /tmp/code735-export.zip -d /tmp/code735
          PKG=/tmp/code735/Lumi-Code735-Dependency-Visual-Closure-R445.zip
          echo "98f49910c1174a7a83219b5da06e0c624a5939e826a838f194a2c851efc621d7  $PKG" | sha256sum -c -
          unzip -t "$PKG" >/dev/null

          python3 - <<'PY'
          import base64, json
          p='/tmp/code735/Lumi-Code735-Dependency-Visual-Closure-R445.zip'
          with open(p,'rb') as f:
              content=base64.b64encode(f.read()).decode('ascii')
          with open('/tmp/package.json','w') as f:
              json.dump({'message':'publish(lumi): add Code735 public package','branch':'main','content':content},f,separators=(',',':'))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.lumi/public-updates/Lumi-Code735-Dependency-Visual-Closure-R445.zip" --input /tmp/package.json >/tmp/package-result.json

          POINTER_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/.lumi/public-updates/latest-update.json?ref=main" --jq .sha)
          python3 - "$POINTER_SHA" <<'PY'
          import base64, json, sys
          pointer={"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code735-dependency-visual-closure-r445","baseVersionCode":734,"minBaseVersionCode":734,"maxBaseVersionCode":734,"targetVersionCode":735,"targetVersionName":"5.3.0-dependency-visual-closure-r445","packageFile":"Lumi-Code735-Dependency-Visual-Closure-R445.zip","packageSha256":"98f49910c1174a7a83219b5da06e0c624a5939e826a838f194a2c851efc621d7","releaseNotes":"Dependency topology truth repair plus deterministic visible renderer baseline and framebuffer visibility gate."}
          raw=(json.dumps(pointer,separators=(',',':'))+'\n').encode()
          payload={'message':'publish(lumi): point public channel to Code735','branch':'main','sha':sys.argv[1],'content':base64.b64encode(raw).decode('ascii')}
          with open('/tmp/pointer.json','w') as f: json.dump(payload,f,separators=(',',':'))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.lumi/public-updates/latest-update.json" --input /tmp/pointer.json >/tmp/pointer-result.json

          gh api "repos/$GITHUB_REPOSITORY/contents/.lumi/public-updates/latest-update.json?ref=main" --jq .content | tr -d '\n' | base64 -d | grep -q '"targetVersionCode":735'
