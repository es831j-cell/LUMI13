name: Import Lumi Code714 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-714.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code714 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-fd08-8230-9282-7985b0adaa54/raw?se=2026-09-14T01%3A09%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=d79fc761-3731-548e-a04b-b1aee1355b7c&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T00%3A37%3A10Z&ske=2026-09-15T00%3A37%3A10Z&sks=b&skv=2026-02-06&sig=UveQyuKGVSgMG4pVKvPEbDHAgYLSY1TEjjyJhnZt1e4%3D' -o /tmp/code714-artifact.zip
          test "$(sha256sum /tmp/code714-artifact.zip | awk '{print $1}')" = 'e078802d7d4f086d010675e81f7bf4d77c5154be162f6e5821cfff6b74cf8a58'
          rm -rf /tmp/code714-artifact && mkdir -p /tmp/code714-artifact
          unzip -q /tmp/code714-artifact.zip -d /tmp/code714-artifact
          PKG=$(find /tmp/code714-artifact -type f -name 'Lumi-Code714-Visual-Gate-R424.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code714-Visual-Gate-R424.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code714-Visual-Gate-R424.zip | awk '{print $1}')
          test "$ACTUAL" = '7a03871b64fefb07189337b42a51d735b136fe7fefef266dd8afc94dab79762a'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code714-visual-gate-r424","baseVersionCode":713,"minBaseVersionCode":713,"maxBaseVersionCode":713,"targetVersionCode":714,"targetVersionName":"5.0.54-visual-gate-r424","packageFile":"Lumi-Code714-Visual-Gate-R424.zip","packageSha256":"7a03871b64fefb07189337b42a51d735b136fe7fefef266dd8afc94dab79762a","releaseNotes":"Visual gate only: portrait-correct Filament projection, stable Home renderer lifecycle, one Lumi-Core-committed camera/light state, and committed-vs-live evidence."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=[u for u in data.setdefault('updates',[]) if int(u.get('targetVersionCode',-1))!=714]
          updates.append({
            "updateId":"code714-visual-gate-r424",
            "baseVersionCode":713,"minBaseVersionCode":713,"maxBaseVersionCode":713,
            "targetVersionCode":714,"targetVersionName":"5.0.54-visual-gate-r424",
            "packageFile":"Lumi-Code714-Visual-Gate-R424.zip",
            "packageSha256":"7a03871b64fefb07189337b42a51d735b136fe7fefef266dd8afc94dab79762a",
            "releaseNotes":"Visual gate: portrait-correct Filament projection, stable Home renderer lifecycle, one committed camera/light state, and committed-vs-live evidence."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code714 Visual Gate on public signed update channel'
          git push
