name: Import Lumi Code719 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-719.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code719 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-621c-81f5-8d6c-c3052fc359fb/raw?se=2026-09-14T12%3A36%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=faa71d59-f7c4-5c33-a9fd-919de860ce77&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T11%3A05%3A02Z&ske=2026-09-15T11%3A05%3A02Z&sks=b&skv=2026-02-06&sig=RQPJsXx1pcpdN/ZQaH1ZGomURe3S5hgDf/R/Oy4kRgE%3D' -o /tmp/code719-artifact.zip
          test "$(sha256sum /tmp/code719-artifact.zip | awk '{print $1}')" = 'baa5cf4662b8e25ea1c19601b661ac2dab964408b54c4b174ac0f0a5c25f6e4c'
          rm -rf /tmp/code719-artifact && mkdir -p /tmp/code719-artifact
          unzip -q /tmp/code719-artifact.zip -d /tmp/code719-artifact
          PKG=$(find /tmp/code719-artifact -type f -name 'Lumi-Code719-Truth-Convergence-R429.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code719-Truth-Convergence-R429.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code719-Truth-Convergence-R429.zip | awk '{print $1}')
          test "$ACTUAL" = 'df7d2a20fadcc37b20c0f4172658f82802408fe58b050d3122d673de37ec0dee'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code719-truth-convergence-r429","baseVersionCode":718,"minBaseVersionCode":718,"maxBaseVersionCode":718,"targetVersionCode":719,"targetVersionName":"5.0.59-truth-convergence-r429","packageFile":"Lumi-Code719-Truth-Convergence-R429.zip","packageSha256":"df7d2a20fadcc37b20c0f4172658f82802408fe58b050d3122d673de37ec0dee","releaseNotes":"Truth convergence: visible muted avatar floor, automatic installed-phone visual measurement, owner-report diagnostic binding, context-aware self-repair, and core health aggregation that prevents false no-fault claims while visual evidence is failing."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=[u for u in data.setdefault('updates',[]) if int(u.get('targetVersionCode',-1))!=719]
          updates.append({
            "updateId":"code719-truth-convergence-r429",
            "baseVersionCode":718,"minBaseVersionCode":718,"maxBaseVersionCode":718,
            "targetVersionCode":719,"targetVersionName":"5.0.59-truth-convergence-r429",
            "packageFile":"Lumi-Code719-Truth-Convergence-R429.zip",
            "packageSha256":"df7d2a20fadcc37b20c0f4172658f82802408fe58b050d3122d673de37ec0dee",
            "releaseNotes":"Truth convergence: visual visibility and telemetry repair plus owner-observation-aware self-maintenance."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code719 Truth Convergence on public signed update channel'
          git push
