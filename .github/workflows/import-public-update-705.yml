name: Import Lumi Code705 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-705.yml'

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code705 package into public distribution lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-9508-81f7-a03d-6d08b7007ae7/raw?se=2026-09-13T16%3A21%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=487fb67c-bc31-5a0f-a718-d1c64c009b0f&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T12%3A21%3A11Z&ske=2026-09-14T12%3A21%3A11Z&sks=b&skv=2026-02-06&sig=BSeIkTPwTguoUmXFpZH04QSYTMyKxtWLBTqJY2MtRiU%3D' -o /tmp/artifact.zip
          rm -rf /tmp/artifact && mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          PKG=$(find /tmp/artifact -type f -name 'Lumi-Code705-Self-Update-Proof-R415.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code705-Self-Update-Proof-R415.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code705-Self-Update-Proof-R415.zip | awk '{print $1}')
          test "$ACTUAL" = '2adc055786b2a01f1f75bb511e08eac9ade46b776fd5bb9eeb97e0cbda5efc09'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code705-self-update-proof-r415","baseVersionCode":704,"minBaseVersionCode":704,"maxBaseVersionCode":704,"targetVersionCode":705,"targetVersionName":"5.0.45-self-update-proof-r415","packageFile":"Lumi-Code705-Self-Update-Proof-R415.zip","packageSha256":"2adc055786b2a01f1f75bb511e08eac9ade46b776fd5bb9eeb97e0cbda5efc09","releaseNotes":"Self-update proof: transaction-aware post-install validation, current-release maintenance truth, separated public-update/developer-bridge diagnostics, and explicit compatibility range validation. Android installer approval remains mandatory."}
          JSON
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code705 on public signed update channel'
          git push
