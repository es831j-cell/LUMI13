name: Import Lumi Code710 Public Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-update-710.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed Code710 package and update sequential index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lumi/public-updates
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0828-81f5-9628-1373e9583c50/raw?se=2026-09-13T21%3A22%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=05140e2c-417d-5df7-91ee-1247669d5390&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T13%3A02%3A11Z&ske=2026-09-14T13%3A02%3A11Z&sks=b&skv=2026-02-06&sig=VfOb8IqAV%2BLkDXinzo1eNz4FM2WLmMTzpjHbnP1%2BfP8%3D' -o /tmp/code710-artifact.zip
          test "$(sha256sum /tmp/code710-artifact.zip | awk '{print $1}')" = '3b5efd1e0eb507ca4e0be99ef2cdf86f62b17882dd13dbe4f5a3e0ed6e411ce2'
          rm -rf /tmp/code710-artifact && mkdir -p /tmp/code710-artifact
          unzip -q /tmp/code710-artifact.zip -d /tmp/code710-artifact
          PKG=$(find /tmp/code710-artifact -type f -name 'Lumi-Code710-Lumi1-Experience-Hardening-R420.zip' | head -n 1)
          test -n "$PKG"
          cp "$PKG" .lumi/public-updates/Lumi-Code710-Lumi1-Experience-Hardening-R420.zip
          ACTUAL=$(sha256sum .lumi/public-updates/Lumi-Code710-Lumi1-Experience-Hardening-R420.zip | awk '{print $1}')
          test "$ACTUAL" = '98bf20d5b042020dd60a7381a0eb1552c7a0d17db629e59ef33af949f2f73428'
          cat > .lumi/public-updates/latest-update.json <<'JSON'
          {"format":"LumiPublicUpdate","formatVersion":1,"updateId":"code710-lumi1-experience-hardening-r420","baseVersionCode":709,"minBaseVersionCode":709,"maxBaseVersionCode":709,"targetVersionCode":710,"targetVersionName":"5.0.50-lumi1-experience-hardening-r420","packageFile":"Lumi-Code710-Lumi1-Experience-Hardening-R420.zip","packageSha256":"98bf20d5b042020dd60a7381a0eb1552c7a0d17db629e59ef33af949f2f73428","releaseNotes":"Lumi 1.0 experience hardening: real human barge-in floor transfer, local speaker identity routing, deterministic self-diagnostics, quality-first Aurora local voice selection with neutral prosody, and a 2050-triangle muted forest-glass visual renderer. Code709 Lumi Core authority and Android security boundaries are preserved."}
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.lumi/public-updates/index.json')
          data=json.loads(p.read_text())
          updates=[u for u in data.setdefault('updates',[]) if int(u.get('targetVersionCode',-1))!=710]
          updates.append({
            "updateId":"code710-lumi1-experience-hardening-r420",
            "baseVersionCode":709,"minBaseVersionCode":709,"maxBaseVersionCode":709,
            "targetVersionCode":710,"targetVersionName":"5.0.50-lumi1-experience-hardening-r420",
            "packageFile":"Lumi-Code710-Lumi1-Experience-Hardening-R420.zip",
            "packageSha256":"98bf20d5b042020dd60a7381a0eb1552c7a0d17db629e59ef33af949f2f73428",
            "releaseNotes":"Lumi 1.0 experience hardening: human barge-in, local speaker identity, direct diagnostics, natural local voice selection, 2050-triangle muted forest-glass visuals; Code709 authority preserved."
          })
          updates.sort(key=lambda u:int(u.get('targetVersionCode',-1)))
          data['updates']=updates
          p.write_text(json.dumps(data,separators=(',',':'))+'\n')
          PY
          git config user.name 'Lumi Public Distribution'
          git config user.email 'lumi-distribution@users.noreply.github.com'
          git add .lumi/public-updates
          git commit -m 'Publish Code710 experience hardening on public signed update channel'
          git push
